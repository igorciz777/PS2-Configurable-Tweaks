name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli (matching 0.2.126)
        run: cargo install wasm-bindgen-cli --version 0.2.126

      - name: Build WASM module
        run: cargo build --release --target wasm32-unknown-unknown
        working-directory: wasm-patcher

      - name: Generate JS bindings
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/wasm_patcher.wasm \
            --out-dir ../frontend/src/wasm \
            --target web
        working-directory: wasm-patcher

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npx tsc -b && npx vite build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
